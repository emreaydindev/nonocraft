# XcodeGen spec: run `xcodegen generate` in this folder, then open Nonocraft.xcodeproj.
# The generated project is not committed.
name: Nonocraft
options:
  bundleIdPrefix: dev.emreaydin
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  Nonocraft:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      - path: Resources
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Nonocraft
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Phones stay portrait; iPad (and its multitasking windows) rotates freely (DECISIONS §15).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - ChakraPetch-Regular.ttf
          - ChakraPetch-Medium.ttf
          - ChakraPetch-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emreaydin.nonocraft
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared]
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          # Xcode does not inherit the shell environment, so locate a JDK.
          if [ -z "$JAVA_HOME" ]; then
            for candidate in "$(/usr/libexec/java_home 2>/dev/null)" "/Applications/Android Studio.app/Contents/jbr/Contents/Home"; do
              if [ -n "$candidate" ] && [ -x "$candidate/bin/java" ]; then export JAVA_HOME="$candidate"; break; fi
            done
          fi
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    scheme:
      testTargets: [NonocraftTests, NonocraftUITests]
  # Unit tests hosted in the app (board VoiceOver elements and actions).
  NonocraftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NonocraftTests
    dependencies:
      - target: Nonocraft
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emreaydin.nonocraft.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nonocraft.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Nonocraft"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # Accessibility audit: walks the main screens, prints their accessibility trees and audit issues.
  NonocraftUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NonocraftUITests
    dependencies:
      - target: Nonocraft
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.emreaydin.nonocraft.uitests
        GENERATE_INFOPLIST_FILE: "YES"
